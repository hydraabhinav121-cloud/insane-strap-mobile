name: Build InSaNe Straps Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile_v3/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK packages
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files without overwriting app source
        run: |
          flutter create --platforms=android --org com.insanestraps --project-name insane_straps_next /tmp/insane_android_template
          cp -R /tmp/insane_android_template/android mobile_v3/android
          # Newer AndroidX plugin metadata requires Android API 36 at compile time.
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' mobile_v3/android/app/build.gradle.kts
      - name: Resolve packages
        working-directory: mobile_v3
        run: flutter pub get
      - name: Analyze Dart code
        working-directory: mobile_v3
        run: flutter analyze
      - name: Build release APK
        working-directory: mobile_v3
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: insane-straps-android-apk
          path: mobile_v3/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
