name: Build InSaNe Straps Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile_v3/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android API 36
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found; available SDK paths:"
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Android platform files without overwriting app source
        run: |
          flutter create --platforms=android --org com.insanestraps --project-name insane_straps_next /tmp/insane_android_template
          cp -R /tmp/insane_android_template/android mobile_v3/android
          GRADLE_FILE="mobile_v3/android/app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then
            echo "Expected Gradle file not found:"
            find mobile_v3/android -maxdepth 3 -type f -print
            exit 1
          fi
          # Pin the app compile SDK to API 36 regardless of the Flutter template default.
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/; s/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' "$GRADLE_FILE"
          echo "Effective Android SDK settings:"
          grep -nE 'compileSdk|targetSdk|minSdk' "$GRADLE_FILE"
          grep -qE 'compileSdk[[:space:]]*=[[:space:]]*36' "$GRADLE_FILE" || { echo "Failed to set compileSdk to 36"; exit 1; }
      - name: Resolve packages
        working-directory: mobile_v3
        run: flutter pub get
      - name: Analyze Dart code
        working-directory: mobile_v3
        run: flutter analyze
      - name: Build release APK
        working-directory: mobile_v3
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: insane-straps-android-apk
          path: mobile_v3/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
