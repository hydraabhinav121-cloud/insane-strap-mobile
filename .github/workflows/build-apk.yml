name: Build InSaNe Straps Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile_v3/**'
      - 'backend/**'
      - 'main.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android API 36
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found; available SDK paths:"
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.insanestraps --project-name insane_straps_next /tmp/insane_android_template
          rm -rf mobile_v3/android
          cp -R /tmp/insane_android_template/android mobile_v3/android
          GRADLE_FILE="mobile_v3/android/app/build.gradle.kts"
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/; s/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' "$GRADLE_FILE"
          echo "App Gradle SDK settings:"
          grep -nE 'compileSdk|targetSdk|minSdk' "$GRADLE_FILE"
          grep -qE 'compileSdk[[:space:]]*=[[:space:]]*36' "$GRADLE_FILE"
      - name: Generate launcher icon and splash image from uploaded logo
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          source = Path('mobile_v3/assets/Screenshot_20261023_151845.jpg')
          target = Path('mobile_v3/assets/app_icon.png')
          if not source.exists():
              raise SystemExit(f'Uploaded InSaNe crown logo not found: {source}')
          image = Image.open(source).convert('RGB')
          # Keep the complete original logo visible on the black background.
          image = ImageOps.fit(image, (512, 512), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          image.save(target, format='PNG', optimize=True)
          print(f'Generated {target} from {source}: {image.size}')
          PY
      - name: Configure floating overlay manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          path = Path('mobile_v3/android/app/src/main/AndroidManifest.xml')
          tree = ET.parse(path)
          root = tree.getroot()
          a = '{http://schemas.android.com/apk/res/android}'
          for name in ['SYSTEM_ALERT_WINDOW', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_SPECIAL_USE']:
              if not any(e.tag == 'uses-permission' and e.get(a+'name') == 'android.permission.'+name for e in root):
                  root.insert(list(root).index(root.find('application')), ET.Element('uses-permission', {a+'name': 'android.permission.'+name}))
          queries = root.find('queries')
          if queries is None:
              queries = ET.Element('queries')
              root.insert(list(root).index(root.find('application')), queries)
          for package in ['com.roblox.client', 'com.dts.freefireth', 'com.dts.freefiremax']:
              if not any(e.get(a+'name') == package for e in queries.findall('package')):
                  ET.SubElement(queries, 'package', {a+'name': package})
          app = root.find('application')
          if not any(e.get(a+'name') == 'flutter.overlay.window.flutter_overlay_window.OverlayService' for e in app.findall('service')):
              service = ET.SubElement(app, 'service', {a+'name':'flutter.overlay.window.flutter_overlay_window.OverlayService', a+'exported':'false', a+'foregroundServiceType':'specialUse'})
              ET.SubElement(service, 'property', {a+'name':'android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE', a+'value':'Displays user-requested InSaNe Straps gaming controls over other apps'})
          tree.write(path, encoding='utf-8', xml_declaration=True)
          print('Overlay service and game visibility configured.')
          PY
      - name: Resolve packages
        working-directory: mobile_v3
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Force Android plugins to compile with API 36
        run: |
          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "Updating plugin compileSdk settings in $PUB_CACHE"
          find "$PUB_CACHE/hosted/pub.dev" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0 |
            xargs -0 -r sed -i -E \
              -e 's/compileSdkVersion[[:space:]]+34/compileSdkVersion 36/g' \
              -e 's/compileSdk[[:space:]]*=[[:space:]]*34/compileSdk = 36/g' \
              -e 's/compileSdk[[:space:]]+34/compileSdk 36/g'
          echo "Remaining plugin compileSdk 34 declarations (if any):"
          grep -RInE 'compileSdkVersion[[:space:]]+34|compileSdk[[:space:]]*=[[:space:]]*34|compileSdk[[:space:]]+34' "$PUB_CACHE/hosted/pub.dev" --include='build.gradle' --include='build.gradle.kts' || true
      - name: Analyze Dart code
        working-directory: mobile_v3
        run: flutter analyze
      - name: Build release APK
        working-directory: mobile_v3
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: insane-straps-android-apk
          path: mobile_v3/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
