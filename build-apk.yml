
name: Build Insane Strap APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract source
        run: |
          mkdir project
          unzip -q Insane_Strap_Mobile_v2_Source.zip -d project
          cd project
          flutter create --platforms=android .
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: insane-strap-apk
          path: project/build/app/outputs/flutter-apk/app-release.apk
          
